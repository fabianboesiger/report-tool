[package]
name = "report-tool"
version.workspace = true
edition.workspace = true

[dependencies]
report-doc = { workspace = true }
report-editor = { workspace = true }
report-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
dioxus = { version = "0.7", features = ["desktop", "router"] }
dioxus-i18n = { workspace = true }
unic-langid = { workspace = true }
# Microphone capture. Stays in the GUI process: device access, the OS permission
# prompt and the level meter all belong where the user is.
cpal = "0.18"
# Native save dialog for exporting a report.
rfd = "0.17"
# Decodes the window icon at startup. Already in the tree as a transitive dependency of
# the webview stack, so this costs no extra compilation — and it beats committing a raw
# RGBA blob nobody can open to look at.
png = "0.18"

# On macOS, always pull in the Metal backend. This is additive with the
# `[dependencies]` entry above (Cargo unions features), so `inference` builds get
# GPU acceleration automatically and stub (`--no-default-features`) builds stay
# clean — `metal` forwards to `llama-cpp-2?/metal`, which is inert when the engine
# is not compiled in.
[target.'cfg(target_os = "macos")'.dependencies]
report-core = { workspace = true, features = ["metal"] }

[features]
# Real inference is ON by default so a plain `cargo run`/`cargo build` and,
# crucially, `dx build`/`dx serve` produce a working app, never a silent stub. The
# Dioxus CLI has no config key for Cargo features — it honours only `--features`
# and the package's Cargo defaults — so the default is the only way to make `dx`
# build inference without remembering a flag.
#
# For the fast stub dev loop (no model downloads, canned generation), use
# `--no-default-features`. NVIDIA users add `--features cuda`; Windows/Linux
# release builds use `--features vulkan`.
default = ["inference", "remote"]
inference = ["report-core/inference"]
remote = ["report-core/remote"]
metal = ["report-core/metal"]
cuda = ["report-core/cuda"]
# The universal GPU backend: NVIDIA + AMD + Intel + integrated, Windows and Linux.
vulkan = ["report-core/vulkan"]
# Runtime backend selection from loadable modules (one installer, every GPU).
# Requires the bundler to ship the ggml shared libs and set an rpath, so it stays
# opt-in until that packaging work lands. See `build.rs`.
runtime-backends = ["report-core/runtime-backends"]
