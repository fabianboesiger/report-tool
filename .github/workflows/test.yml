name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The fast job: everything that does not need a C++ engine. This is the one that
  # should gate a merge, because it runs in a couple of minutes and covers where the
  # logic actually lives — the document model, the two constraint emitters, the
  # renderer and the store.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Needed even for the stub build: Dioxus desktop links webkit2gtk and gtk.
      # Plain apt-get so transitive -dev packages resolve; libglib2.0-dev is listed
      # explicitly because gobject-2.0.pc comes from it and its absence shows up as a
      # confusing pkg-config failure.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libasound2-dev

      - run: cargo fmt --all -- --check
      # `--all-targets`, so tests and examples are linted too. Without it CI was weaker
      # than a local `cargo clippy --all-targets`, which is where three real warnings were
      # found — a lint that only fires on a test target is still a lint.
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      # The UI-free crates carry the tests worth running on every push.
      - run: cargo test -p report-doc -p report-core --verbose

      # Compile the UI in stub mode to catch breakage cheaply: no C++ engines, no
      # model downloads, seconds rather than minutes.
      - run: cargo build --workspace --no-default-features --verbose
      - run: cargo test --workspace --no-default-features --verbose

  # Compile every GPU backend we ship, on the platform that ships it.
  #
  # This job exists because its absence is what lets a backend rot: nothing else in
  # CI ever compiles llama.cpp or whisper.cpp, so a break in the CUDA or Vulkan path
  # would go unnoticed until someone tried to cut a release. Slow (tens of minutes
  # cold) but heavily cached.
  backends:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS gets Metal automatically from the target-specific dependency in
          # app/Cargo.toml, so no feature flag is needed here.
          - os: macos-latest
            features: ""
          - os: ubuntu-latest
            features: "vulkan"
          - os: windows-latest
            features: "vulkan"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libasound2-dev

      # ggml's Vulkan backend compiles its shaders at build time with glslc, which
      # comes from the SDK rather than from the driver.
      - name: Install the Vulkan SDK
        if: matrix.features == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      - name: Build with the platform's GPU backend
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build -p report-tool --features "${{ matrix.features }}" --verbose
          else
            cargo build -p report-tool --verbose
          fi

      # The only place inference-gated code gets linted: every other job in either
      # workflow is a stub build, and `dx bundle` runs cargo without clippy. Cheap here
      # because this job has already compiled the dependency graph.
      - name: Lint with inference compiled in
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy -p report-core --all-targets \
              --features "inference,remote,${{ matrix.features }}" -- -D warnings
          else
            cargo clippy -p report-core --all-targets \
              --features inference,remote -- -D warnings
          fi

      # Runs the engines far enough to prove they linked and initialise. Actual
      # generation needs a model, which CI has no business downloading on every run.
      - name: Test with inference compiled in
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test -p report-core --features "inference,remote,${{ matrix.features }}" --verbose
          else
            cargo test -p report-core --features inference,remote --verbose
          fi
